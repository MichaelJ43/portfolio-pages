name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same-origin previews must not execute PR-controlled generator/templates.
      - name: Use trusted generator from PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- src templates shard.yml

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: "1.19.1"

      - name: Build site generator
        run: |
          mkdir -p bin
          crystal build --release src/sitegen.cr -o bin/sitegen

      - name: Build static site
        run: ./bin/sitegen

      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-site
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy-preview:
    needs: build-preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Download static site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-site
          path: dist

      - name: Resolve preview path
        id: base
        env:
          EXPLICIT: ${{ vars.SITE_BASE_PATH }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT" ]; then
            ROOT="$EXPLICIT"
            [ "${ROOT#/}" != "$ROOT" ] || ROOT="/$ROOT"
            if [ "$ROOT" != "/" ] && [ "${ROOT%/}" = "$ROOT" ]; then
              ROOT="${ROOT}/"
            fi
            if ! [[ "$ROOT" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
              echo "::error::SITE_BASE_PATH contains unsupported characters"
              exit 1
            fi
            if [[ "$ROOT" =~ /\.\.?(/|$) ]]; then
              echo "::error::SITE_BASE_PATH must not contain '.' or '..' path segments"
              exit 1
            fi
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            ROOT="/"
          else
            ROOT="/$REPO/"
          fi
          if [ "$ROOT" = "/" ]; then
            PREVIEW_PATH="/preview/pr-${PR}/"
          else
            PREVIEW_PATH="${ROOT%/}/preview/pr-${PR}/"
          fi
          printf 'path=%s\n' "$PREVIEW_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish preview to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Compute preview URL
        id: preview
        env:
          CUSTOM: ${{ vars.CUSTOM_PAGES_URL }}
          OWNER: ${{ github.repository_owner }}
          P: ${{ steps.base.outputs.path }}
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM:-}" ]; then
            ORIGIN="${CUSTOM%/}"
            if ! [[ "$ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
              echo "::error::CUSTOM_PAGES_URL must be an https origin with no path or query"
              exit 1
            fi
            printf 'url=%s%s\n' "$ORIGIN" "$P" >> "$GITHUB_OUTPUT"
          else
            printf 'url=https://%s.github.io%s\n' "$OWNER" "$P" >> "$GITHUB_OUTPUT"
          fi

      - name: Find preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "**Website preview:**"

      - name: Post or update preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            **Website preview:** ${{ steps.preview.outputs.url }}

            Built from `${{ github.sha }}`.
          edit-mode: replace

  live-test-preview:
    needs: deploy-preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Live-test preview site
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::Missing preview URL from deploy-preview"
            exit 1
          fi

          echo "Checking ${PREVIEW_URL}"
          for attempt in $(seq 1 24); do
            code="$(curl -sS -L --max-time 30 -o /tmp/preview.html -w '%{http_code}' "$PREVIEW_URL" || true)"
            if [ "$code" = "200" ] \
              && grep -qi '<html' /tmp/preview.html \
              && grep -qi '</html>' /tmp/preview.html \
              && grep -Eqi 'Selected work|Pages|Corporate Projects|portfolio' /tmp/preview.html
            then
              echo "Preview live-test passed on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}; waiting for Pages to publish..."
            sleep 10
          done

          echo "::error::Preview site did not become healthy at ${PREVIEW_URL}"
          if [ -f /tmp/preview.html ]; then
            echo "Last response body (truncated):"
            head -c 2000 /tmp/preview.html || true
          fi
          exit 1

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview folder
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DIR="preview/pr-${PR}"
          if [ ! -d "$DIR" ]; then
            echo "No folder $DIR — nothing to do."
            exit 0
          fi
          git rm -rf "$DIR"
          if git diff --staged --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "chore: remove website preview for PR #${PR}"
          git push
