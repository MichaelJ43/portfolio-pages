name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: "1.19.1"

      - name: Build site generator
        run: |
          mkdir -p bin
          crystal build --release src/sitegen.cr -o bin/sitegen

      - name: Build static site
        run: ./bin/sitegen

      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-site
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy-preview:
    needs: build-preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download static site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-site
          path: dist

      - name: Resolve preview path
        id: base
        env:
          EXPLICIT: ${{ vars.SITE_BASE_PATH }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT" ]; then
            ROOT="$EXPLICIT"
            [ "${ROOT#/}" != "$ROOT" ] || ROOT="/$ROOT"
            if [ "$ROOT" != "/" ] && [ "${ROOT%/}" = "$ROOT" ]; then
              ROOT="${ROOT}/"
            fi
            if ! [[ "$ROOT" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
              echo "::error::SITE_BASE_PATH contains unsupported characters"
              exit 1
            fi
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            ROOT="/"
          else
            ROOT="/$REPO/"
          fi
          if [ "$ROOT" = "/" ]; then
            PREVIEW_PATH="/preview/pr-${PR}/"
          else
            PREVIEW_PATH="${ROOT%/}/preview/pr-${PR}/"
          fi
          printf 'path=%s\n' "$PREVIEW_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish preview to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Compute preview URL
        id: preview
        env:
          CUSTOM: ${{ vars.CUSTOM_PAGES_URL }}
        run: |
          OWNER="${{ github.repository_owner }}"
          P="${{ steps.base.outputs.path }}"
          if [ -n "${CUSTOM:-}" ]; then
            ORIGIN="${CUSTOM%/}"
            printf 'url=%s%s\n' "$ORIGIN" "$P" >> "$GITHUB_OUTPUT"
          else
            printf 'url=https://%s.github.io%s\n' "$OWNER" "$P" >> "$GITHUB_OUTPUT"
          fi

      - name: Find preview comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "**Website preview:**"

      - name: Post or update preview comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            **Website preview:** ${{ steps.preview.outputs.url }}

            Built from `${{ github.sha }}`.
          edit-mode: replace

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview folder
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PR=${{ github.event.pull_request.number }}
          DIR="preview/pr-${PR}"
          if [ ! -d "$DIR" ]; then
            echo "No folder $DIR — nothing to do."
            exit 0
          fi
          git rm -rf "$DIR"
          if git diff --staged --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "chore: remove website preview for PR #${PR}"
          git push
